<!-- 브라우저 탭에 뜨는 아이콘(파비콘). 새 마스코트 얼굴을 단순하게 옮겨 그렸습니다. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9550"/>
      <stop offset="100%" stop-color="#E85F0B"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF6E8"/>
      <stop offset="62%" stop-color="#FFE5C6"/>
      <stop offset="100%" stop-color="#F0CCA0"/>
    </linearGradient>
  </defs>

  <rect width="120" height="120" rx="30" fill="url(#bg)"/>

  <g transform="translate(60 64) scale(1.16) translate(-60 -60)">
    <!-- 귀 -->
    <g stroke="#C79A63" stroke-width="3" stroke-linejoin="round">
      <path d="M24 50 C21 30 24 15 31 13 C38 11 51 22 57 30 Z" fill="url(#fur)"/>
      <path d="M96 50 C99 30 96 15 89 13 C82 11 69 22 63 30 Z" fill="url(#fur)"/>
    </g>
    <path d="M31 44 C29.5 30 31 21 34.5 20 C38.5 19.5 46.5 27 50 32 Z" fill="#FFC3CB"/>
    <path d="M89 44 C90.5 30 89 21 85.5 20 C81.5 19.5 73.5 27 70 32 Z" fill="#FFC3CB"/>

    <!-- 얼굴 -->
    <path d="M60 24 C79 24 94 33 98 48 C101 60 99 78 88 90 C79 100 70 103 60 103 C50 103 41 100 32 90 C21 78 19 60 22 48 C26 33 41 24 60 24 Z"
          fill="url(#fur)" stroke="#C79A63" stroke-width="3" stroke-linejoin="round"/>

    <!-- 볼터치 -->
    <ellipse cx="30" cy="76" rx="8" ry="5" fill="#FF8AA0" opacity="0.4"/>
    <ellipse cx="90" cy="76" rx="8" ry="5" fill="#FF8AA0" opacity="0.4"/>

    <!-- 눈 -->
    <ellipse cx="45.5" cy="63" rx="8.2" ry="10.2" fill="#3A2A20"/>
    <ellipse cx="74.5" cy="63" rx="8.2" ry="10.2" fill="#3A2A20"/>
    <circle cx="42.9" cy="58.5" r="3.1" fill="#FFFFFF"/>
    <circle cx="71.9" cy="58.5" r="3.1" fill="#FFFFFF"/>

    <!-- 코와 입 -->
    <path d="M53.8 76 C56.2 74.4 63.8 74.4 66.2 76 C67.2 76.7 66.4 78.8 63.5 81.4 C61.7 83 58.3 83 56.5 81.4 C53.6 78.8 52.8 76.7 53.8 76 Z" fill="#F2748C"/>
    <g stroke="#3A2A20" stroke-width="2.6" stroke-linecap="round" fill="none">
      <path d="M60 83.5 C60 89 55.8 90.6 52.8 88.4"/>
      <path d="M60 83.5 C60 89 64.2 90.6 67.2 88.4"/>
    </g>
  </g>
</svg>
