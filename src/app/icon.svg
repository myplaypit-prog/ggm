<!-- 브라우저 탭 아이콘(파비콘). CatArtwork.tsx 의 새 얼굴을 그대로 옮겨 그렸습니다. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FF9550"/>
      <stop offset="100%" stop-color="#E85F0B"/>
    </linearGradient>
    <linearGradient id="fur" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFCF6"/>
      <stop offset="48%" stop-color="#FFEBD2"/>
      <stop offset="100%" stop-color="#F3D5AF"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFC2CC"/>
      <stop offset="100%" stop-color="#FF9FB2"/>
    </linearGradient>
    <radialGradient id="eye" cx="34%" cy="26%" r="85%">
      <stop offset="0%" stop-color="#6B4A33"/>
      <stop offset="55%" stop-color="#3B2A1E"/>
      <stop offset="100%" stop-color="#241710"/>
    </radialGradient>
    <linearGradient id="nose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFA7B6"/>
      <stop offset="100%" stop-color="#EE7389"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="32" fill="url(#bg)"/>

  <g transform="translate(64 68) scale(1.1) translate(-64 -66)">
    <!-- 귀 -->
    <path d="M24 52 C19 34 21 14 27 9 C33 5 41 14 46 21 C51 28 56 31 60 34 Z" fill="url(#fur)"/>
    <path d="M104 52 C109 34 107 14 101 9 C95 5 87 14 82 21 C77 28 72 31 68 34 Z" fill="url(#fur)"/>
    <path d="M32 46 C28 32 30 18 34 16 C38 14 43 21 46 25.5 C49 30 53 33 56 35 Z" fill="url(#ear)"/>
    <path d="M96 46 C100 32 98 18 94 16 C90 14 85 21 82 25.5 C79 30 75 33 72 35 Z" fill="url(#ear)"/>

    <!-- 얼굴 -->
    <path d="M64 26 C81 26 94 33 100 45 C106 57 104 74 96 85 C88 97 77 105 64 105 C51 105 40 97 32 85 C24 74 22 57 28 45 C34 33 47 26 64 26 Z" fill="url(#fur)"/>

    <!-- 볼터치 -->
    <ellipse cx="37" cy="82" rx="9" ry="5.5" fill="#FF8FA5" opacity="0.4"/>
    <ellipse cx="91" cy="82" rx="9" ry="5.5" fill="#FF8FA5" opacity="0.4"/>

    <!-- 눈 -->
    <ellipse cx="48" cy="70" rx="9.4" ry="11.4" fill="url(#eye)"/>
    <ellipse cx="80" cy="70" rx="9.4" ry="11.4" fill="url(#eye)"/>
    <circle cx="45" cy="65.4" r="3.5" fill="#FFFFFF"/>
    <circle cx="77" cy="65.4" r="3.5" fill="#FFFFFF"/>
    <circle cx="51.4" cy="75" r="1.8" fill="#FFFFFF" opacity="0.72"/>
    <circle cx="83.4" cy="75" r="1.8" fill="#FFFFFF" opacity="0.72"/>

    <!-- 코와 입 -->
    <path d="M57 83.5 C59.4 81.6 68.6 81.6 71 83.5 C72.2 84.4 71.3 86.8 67.8 89.8 C65.7 91.6 62.3 91.6 60.2 89.8 C56.7 86.8 55.8 84.4 57 83.5 Z" fill="url(#nose)"/>
    <g stroke="#372A22" stroke-width="2.6" stroke-linecap="round" fill="none">
      <path d="M64 91 C64 98 58.4 100.2 54.6 97"/>
      <path d="M64 91 C64 98 69.6 100.2 73.4 97"/>
    </g>
  </g>
</svg>
